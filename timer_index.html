<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Countdown</title>
<style>
    body {
        background: #111;
        color: white;
        font-family: Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .block {
        text-align: center;
    }

    .number {
        background: #222;
        padding: 20px 30px;
        font-size: 60px;
        font-weight: bold;
        border-radius: 10px;
    }

    .label {
        margin-top: 8px;
        font-size: 14px;
        font-weight: 300;
        color: white;
    }

    .colon {
        font-size: 50px;
        font-weight: bold;
        padding-bottom: 25px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="block">
        <div id="days" class="number">00</div>
        <div class="label">tage</div>
    </div>

    <div class="colon">:</div>

    <div class="block">
        <div id="hours" class="number">00</div>
        <div class="label">stunden</div>
    </div>

    <div class="colon">:</div>

    <div class="block">
        <div id="minutes" class="number">00</div>
        <div class="label">minuten</div>
    </div>

    <div class="colon">:</div>

    <div class="block">
        <div id="seconds" class="number">00</div>
        <div class="label">sekunden</div>
    </div>
</div>

<script>
    // Startdatum
    const start = new Date(2026, 8, 7, 12, 8, 8); // Monate: 0 = Januar → 8 = September

    // Zielzeit berechnen
    let targetYear = start.getFullYear() + 8;
    let targetMonth = start.getMonth() + 8;

    while (targetMonth > 11) {
        targetMonth -= 12;
        targetYear += 1;
    }

    const target = new Date(
        targetYear,
        targetMonth,
        start.getDate() + 56, // 8 Wochen
        start.getHours() + 8
    );

    function updateTimer() {
        const now = new Date();
        const diff = target - now;

        if (diff <= 0) {
            document.getElementById("days").innerText = "X";
            document.getElementById("hours").innerText = "X";
            document.getElementById("minutes").innerText = "X";
            document.getElementById("seconds").innerText = "X";
            return;
        }

        let seconds = Math.floor(diff / 1000);

        const d = Math.floor(seconds / 86400);
        seconds %= 86400;

        const h = Math.floor(seconds / 3600);
        seconds %= 3600;

        const m = Math.floor(seconds / 60);
        const s = seconds % 60;

        document.getElementById("days").innerText = String(d).padStart(2, "0");
        document.getElementById("hours").innerText = String(h).padStart(2, "0");
        document.getElementById("minutes").innerText = String(m).padStart(2, "0");
        document.getElementById("seconds").innerText = String(s).padStart(2, "0");
    }

    setInterval(updateTimer, 1000);
    updateTimer();
</script>

</body>
</html>
